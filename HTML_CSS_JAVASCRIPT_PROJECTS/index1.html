
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Emotion Music Player</title>
    <link rel="stylesheet" href="style1.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>EEG Emotion Music Player</h1>
        <span id="status" class="disconnected">Disconnected</span>
    </header>

    <main>
        <!-- EEG Live Graph -->
        <section class="eeg-section">
            <h2>Live EEG Signals</h2>
            <canvas id="eegChart"></canvas>
        </section>

        <!-- Emotion Display -->
        <section class="emotion-section">
            <h2>Current Mood</h2>
            <div id="emoji">😐</div>
            <p id="moodText">Neutral</p>
        </section>

        <!-- Music Player -->
        <section class="music-section">
            <h2>Music Player</h2>
            <img id="albumArt" src="https://via.placeholder.com/150" alt="Album Art">
            <p id="songTitle">Song Title</p>
            <p id="artistName">Artist</p>
            <div class="controls">
                <button id="playPause">Play/Pause</button>
                <button id="next">Next</button>
            </div>
        </section>
    </main>

    <!-- Emotion History -->
    <aside>
        <h2>Emotion History</h2>
        <canvas id="historyChart"></canvas>
    </aside>

    <script src="script1.js"></script>
</body>
</html>
